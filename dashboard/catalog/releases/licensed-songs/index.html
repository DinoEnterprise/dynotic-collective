<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Licensed | Dynotic Distribution</title>
<meta name="theme-color" content="#f3f3f8">

<link rel="icon" type="image/png" href="https://dynoticcollective.com/assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://dynoticcollective.com/assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://dynoticcollective.com/assets/favicon-iphone.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f3f8;
  --paper:#fff;
  --ink:#14141a;
  --muted:#6f7280;
  --line:#e6e6ee;
  --dark:#0d0d12;
  --accent:#7772a8;
  --accent-2:#a9a3f2;
  --red:#ef4444;
  --ease:cubic-bezier(.16,1,.3,1);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:"Outfit",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.fill{fill:currentColor;stroke:none}

/* ================= TOPBAR ================= */
.topbar{position:sticky;top:0;z-index:50;height:68px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;background:rgba(243,243,248,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease),border-color .2s;flex-shrink:0}
.icon-btn:hover{border-color:#cfcfdb}
.icon-btn:active{transform:scale(.93)}
.icon-btn .i{width:19px;height:19px}
.topbar .logo img{height:30px;width:auto;max-width:170px;object-fit:contain;display:block}
.page-title{display:none;font-size:20px;font-weight:800;letter-spacing:-.03em}

/* ================= LAYOUT ================= */
.wrap{width:100%;max-width:880px;margin:0 auto;padding:6px 16px 0}

/* ================= HERO ================= */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;background:var(--dark);color:#fff;padding:clamp(22px,4vw,34px);animation:up .6s var(--ease) both}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none}
.hero::before{width:360px;height:360px;background:rgba(119,114,168,.6);top:-160px;right:-80px}
.hero::after{width:300px;height:300px;background:rgba(79,70,160,.4);bottom:-170px;left:-80px}
.hero-grid{position:absolute;inset:0;z-index:-1;opacity:.25;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 80% 20%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 80% 20%,#000 10%,transparent 70%)}
.h-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:rgba(255,255,255,.65)}
.h-label .i{width:17px;height:17px;color:var(--accent-2)}
.h-amount{margin-top:14px;display:flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.h-amount .val{font-size:clamp(36px,8vw,58px)}
.h-amount .cur{font-size:clamp(16px,2.6vw,22px);font-weight:600;opacity:.6;letter-spacing:0}
.h-foot{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}
.chip b{font-weight:800;color:#fff}
.h-desc{margin-top:16px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.5)}

.sk{display:inline-block;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.2),rgba(255,255,255,.08));background-size:200% 100%;animation:sh 1.3s linear infinite;color:transparent!important}

/* ================= SECTIONS ================= */
.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px;scroll-margin-top:84px}
.sec-head h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec-head .meta{display:flex;align-items:center;gap:6px}
.count{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.reset{font-size:12px;font-weight:700;color:var(--accent);padding:6px 10px;border-radius:999px;transition:background .2s}
.reset:hover{background:#e9e8f4}
.reset[hidden]{display:none}

/* ================= TOOLBAR ================= */
.toolbar{display:flex;flex-direction:column;gap:10px;position:sticky;top:68px;z-index:40;padding:8px 0 10px;background:linear-gradient(var(--bg) 78%,rgba(243,243,248,0))}
.search{position:relative}
.search .i{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#a3a5b0;pointer-events:none}
.search input{width:100%;height:50px;padding:0 48px 0 44px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:#a3a5b0}
.search input:focus{border-color:#cfcdea;box-shadow:0 0 0 4px rgba(119,114,168,.12)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:11px;background:var(--bg);display:none;align-items:center;justify-content:center}
.search .clear.show{display:flex}
.search .clear .i{position:static;transform:none;width:15px;height:15px;color:var(--ink)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.select{position:relative}
.select select{width:100%;height:46px;padding:0 38px 0 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13px;font-weight:500;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;text-overflow:ellipsis;transition:border-color .2s}
.select select:focus{border-color:#cfcdea}
.select .i{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}

/* ================= SONG LIST ================= */
.list{display:flex;flex-direction:column;gap:10px}
.song{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;transition:border-color .25s,box-shadow .25s}
.song:hover{border-color:#d3d1e6;box-shadow:0 14px 30px rgba(20,20,40,.06)}

/* thumbnail referensi YouTube */
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#2a2a36,#1b1b24);margin-bottom:14px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s,transform .6s var(--ease)}
.thumb img.ok{opacity:1}
.song:hover .thumb img.ok,.thumb:hover img.ok{transform:scale(1.04)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(13,13,18,.5));pointer-events:none}
.thumb .play{position:absolute;left:50%;top:50%;z-index:1;width:50px;height:50px;border-radius:50%;background:rgba(13,13,18,.72);color:#fff;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .3s var(--ease),background .2s}
.thumb .play .i{width:20px;height:20px;margin-left:2px}
.thumb:hover .play{transform:translate(-50%,-50%) scale(1.08);background:var(--ink)}
.thumb .tag{position:absolute;left:10px;bottom:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(13,13,18,.65);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.thumb .tag .i{width:11px;height:11px}
.thumb.big{border-radius:18px;margin:6px 0 12px}

.s-top{display:flex;align-items:flex-start;gap:14px}
.s-ic{width:46px;height:46px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);transition:background .25s,color .25s}
.s-ic .i{width:21px;height:21px}
.song:hover .s-ic{background:var(--ink);color:#fff}
.s-main{min-width:0;flex:1}
.s-title{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.s-perf{margin-top:2px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.s-id{display:inline-flex;align-items:center;gap:6px;margin-top:10px;max-width:100%;height:30px;padding:0 6px 0 10px;border-radius:999px;background:var(--bg);font-size:11px;font-weight:700;color:#3a3c48;transition:background .2s}
.s-id:hover{background:#e9e8f4}
.s-id .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-id .i{width:13px;height:13px;color:var(--accent)}
.s-id .cp{width:22px;height:22px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.s-meta small{display:block;font-size:11px;color:#a3a5b0;font-weight:500}
.s-meta span{display:block;margin-top:2px;font-size:12px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.s-acts{display:flex;gap:8px;margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s,background .2s;flex:1;white-space:nowrap}
.btn .i{width:16px;height:16px}
.btn:hover{transform:translateY(-2px);background:#fafafd}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#25252e;box-shadow:0 10px 24px rgba(20,20,26,.2)}

/* skeleton & empty */
.sk-card{height:178px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(90deg,#fff,#f4f4f9,#fff);background-size:200% 100%;animation:sh 1.3s linear infinite}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:22px}
.empty .ic{width:50px;height:50px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.empty .ic .i{width:22px;height:22px}
.empty strong{font-size:14px;font-weight:700;color:var(--ink)}
.empty .btn{flex:none;margin-top:8px;height:40px}

/* ================= PAGINATION ================= */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;flex-wrap:wrap}
.pager[hidden]{display:none}
.pg{min-width:40px;height:40px;padding:0 6px;border-radius:13px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease),border-color .2s,background .2s}
.pg .i{width:16px;height:16px}
.pg:hover:not(:disabled):not(.on){border-color:#cfcfdb}
.pg:active:not(:disabled){transform:scale(.92)}
.pg.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.pg:disabled{opacity:.4;cursor:default}
.pg-gap{width:20px;text-align:center;color:#a3a5b0;font-weight:700}
.page-info{width:100%;text-align:center;font-size:12px;color:var(--muted);margin-top:4px}

/* ================= DETAIL SHEET ================= */
.overlay{position:fixed;inset:0;background:rgba(13,13,18,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:300;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.show{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;top:50%;width:calc(100% - 32px);max-width:460px;max-height:86dvh;background:var(--paper);border-radius:28px;z-index:310;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.97);transition:all .35s var(--ease);box-shadow:0 30px 80px rgba(13,13,18,.25)}
.sheet.show{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 8px}
.sh-head small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.sh-head h3{margin-top:2px;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.25;overflow-wrap:anywhere}
.sh-x{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sh-x .i{width:17px;height:17px}
.sh-body{overflow-y:auto;padding:8px 22px 4px;overscroll-behavior:contain}
.row{padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:11px;color:#a3a5b0;font-weight:500}
.row .v{margin-top:3px;font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px;justify-content:space-between}
.row .v a{color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.row .v a .i{width:14px;height:14px}
.copy-mini{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.copy-mini:hover{background:#e9e8f4}
.copy-mini .i{width:15px;height:15px}
.sh-foot{padding:14px 22px calc(20px + env(safe-area-inset-bottom))}
.sh-acts{display:flex;gap:8px}
.sh-note{margin-top:12px;font-size:12px;line-height:1.6;color:var(--muted);text-align:center}

/* ================= TOAST ================= */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:500;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}

/* ================= DESKTOP ================= */
@media(min-width:1000px){
  .topbar{height:78px;padding:0 36px}
  .toolbar{top:78px}
  .sec-head{scroll-margin-top:94px}
  .page-title{display:block}
  .topbar .logo{margin-left:auto}
  .wrap{max-width:960px;padding:6px 36px 0}
  .filters{grid-template-columns:1fr 240px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sk-card{height:190px}
}

/* ================= MOBILE ================= */
@media(max-width:700px){
  .wrap{padding:0 14px}
  .hero{border-radius:24px}
  .sheet{top:auto;bottom:0;left:0;width:100%;max-width:100%;max-height:88dvh;border-radius:26px 26px 0 0;transform:translateY(102%);box-shadow:0 -20px 60px rgba(0,0,0,.2)}
  .sheet.show{transform:none}
}
@media(max-width:360px){
  .s-meta{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

</svg>

<!-- ================= TOPBAR ================= -->
<header class="topbar" id="topbar">
  <button class="icon-btn" id="backBtn" type="button" aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
  <h2 class="page-title">Song Catalog</h2>
  <a href="../dashboard" class="logo"><img src="../assets/dynotic-distribution.png" alt="Dynotic Distribution"></a>
</header>

<!-- ================= MAIN ================= -->
<main class="wrap">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-grid"></div>
    <div class="h-label"><svg class="i"><use href="#i-music"/></svg>Song Catalog</div>
    <div class="h-amount"><span class="val sk" id="totalVal">0.000</span><span class="cur">lagu</span></div>
    <div class="h-foot">
      <span class="chip"><b id="pubCount">-</b> publisher</span>
      <span class="chip"><b id="hitCount">-</b> hasil</span>
    </div>
    <p class="h-desc">Cari lagu, lalu ajukan permohonan cover dengan mudah.</p>
  </section>

  <!-- LIST -->
  <section class="sec">
    <div class="sec-head" id="listTop">
      <h2>Daftar lagu</h2>
      <div class="meta">
        <button type="button" class="reset" id="resetBtn" hidden>Reset filter</button>
        <span class="count" id="resultCount">Memuat…</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input type="search" id="searchInput" placeholder="Cari judul, artis, composer, Song ID…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Cari lagu">
        <button type="button" class="clear" id="clearBtn" aria-label="Hapus pencarian"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="filters">
        <div class="select">
          <select id="publisherFilter" aria-label="Filter publisher"><option value="">Semua publisher</option></select>
          <svg class="i"><use href="#i-chev-d"/></svg>
        </div>
        <div class="select">
          <select id="sortSelect" aria-label="Urutkan">
            <option value="default">Urutan katalog</option>
            <option value="title-asc">Judul A–Z</option>
            <option value="title-desc">Judul Z–A</option>
            <option value="performer">Performer A–Z</option>
            <option value="publisher">Publisher A–Z</option>
          </select>
          <svg class="i"><use href="#i-chev-d"/></svg>
        </div>
      </div>
    </div>

    <div id="songList" class="list" aria-live="polite">
      <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
    </div>

    <nav class="pager" id="pager" aria-label="Halaman katalog" hidden></nav>
  </section>

</main>

<!-- ================= DETAIL SHEET ================= -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="sh-head">
    <div>
      <small>Detail lagu</small>
      <h3 id="modalTitle">-</h3>
    </div>
    <button class="sh-x" id="closeBtn" type="button" aria-label="Tutup"><svg class="i"><use href="#i-x"/></svg></button>
  </div>

  <div class="sh-body">
    <div id="m_thumb"></div>
    <div class="row">
      <small>Song ID</small>
      <div class="v"><span id="m_songId">-</span><button type="button" class="copy-mini" id="copyId" aria-label="Salin Song ID"><svg class="i"><use href="#i-copy"/></svg></button></div>
    </div>
    <div class="row"><small>Judul lagu</small><div class="v" id="m_title">-</div></div>
    <div class="row"><small>Composer</small><div class="v" id="m_composer">-</div></div>
    <div class="row"><small>Publisher</small><div class="v" id="m_publisher">-</div></div>
    <div class="row"><small>Performer</small><div class="v" id="m_performer">-</div></div>
    <div class="row" id="m_refRow" hidden><small>Referensi</small><div class="v"><a id="m_ref" href="#" target="_blank" rel="noopener noreferrer">Buka referensi<svg class="i"><use href="#i-ext"/></svg></a></div></div>
  </div>

  <div class="sh-foot">
    <div class="sh-acts">
      <button class="btn dark" id="submitBtn" type="button"><svg class="i"><use href="#i-send"/></svg>Ajukan Cover</button>
      <button class="btn" id="closeBtn2" type="button">Tutup</button>
    </div>
    <p class="sh-note">Pengajuan cover akan dilanjutkan melalui akun Dynotic kamu.</p>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ================= CONFIG ================= */
const ITEMS_PER_PAGE = 10;

/* ================= JSON SOURCES ================= */
const sources = [
  "mahar-pustaka.json",
  "18musik.json",
  "dynotic-collective.json",
  "nadaku-musik.json",
  "royal-publikasi.json",
  "alfa-pustaka.json",
  "pustaka-cipta.json",
  "star-cipta.json",
  "sora-music.json",
  "proaktif-digital.json",
  "sony-music.json",
  "istana-publishing.json"
];

/* ================= STATE ================= */
const $ = id => document.getElementById(id);

let songs = [];
let filtered = [];
let currentPage = 1;
let selectedSong = null;
let lastFocus = null;
let searchTimer = null;

const songList = $("songList");
const searchInput = $("searchInput");
const publisherFilter = $("publisherFilter");
const sortSelect = $("sortSelect");
const pager = $("pager");

/* ================= HELPERS ================= */
function safeText(value, fallback = "-"){
  if(value === undefined || value === null || String(value).trim() === "") return fallback;
  return String(value).trim();
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function normalizeLink(value){
  const raw = safeText(value, "-");
  if(raw === "-") return "-";
  try{
    const url = new URL(raw);
    if(url.protocol === "https:" || url.protocol === "http:") return url.href;
  }catch(_){}
  return "-";
}

/* ambil ID video YouTube dari berbagai bentuk link */
function youtubeId(link){
  if(!link || link === "-") return "";
  let u;
  try{ u = new URL(link); }catch(_){ return ""; }
  const host = u.hostname.replace(/^www\.|^m\.|^music\./, "");
  let id = "";
  if(host === "youtu.be") id = u.pathname.split("/")[1] || "";
  else if(host === "youtube.com" || host === "youtube-nocookie.com"){
    if(u.pathname === "/watch") id = u.searchParams.get("v") || "";
    else{
      const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?#]+)/);
      if(m) id = m[1];
    }
  }
  return /^[\w-]{11}$/.test(id) ? id : "";
}

/* thumbnail referensi: tautan ke video + gambar dari i.ytimg.com */
function makeThumb(song, big){
  if(!song.ytId) return null;
  const a = document.createElement("a");
  a.className = "thumb" + (big ? " big" : "");
  a.href = song.youtube;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", "Putar referensi YouTube: " + song.title);

  const img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";
  img.decoding = "async";
  img.referrerPolicy = "no-referrer";
  img.addEventListener("load", () => {
    /* YouTube mengirim gambar abu-abu kecil (120px) bila thumbnail tidak ada */
    if(img.naturalWidth <= 120) a.remove();
    else img.classList.add("ok");
  });
  img.addEventListener("error", () => a.remove());
  img.src = "https://i.ytimg.com/vi/" + song.ytId + "/hqdefault.jpg";
  a.appendChild(img);

  a.insertAdjacentHTML("beforeend",
    '<span class="play">' + icon("play", "fill") + '</span>' +
    '<span class="tag">' + icon("ext") + 'REFERENSI YOUTUBE</span>');
  return a;
}

function fmt(n){ return Number(n || 0).toLocaleString("id-ID"); }

function icon(name, cls){ return '<svg class="i' + (cls ? " " + cls : "") + '"><use href="#i-' + name + '"/></svg>'; }

function toast(text){
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function copyText(text, okMsg){
  const done = () => toast(okMsg);
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }catch(_){ toast("Gagal menyalin."); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{
    fallback();
  }
}

function animateNumber(el, target){
  const start = performance.now();
  const duration = 700;
  function frame(now){
    const p = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(target * eased));
    if(p < 1) requestAnimationFrame(frame);
    else el.textContent = fmt(target);
  }
  requestAnimationFrame(frame);
}

/* ================= TOPBAR ================= */
$("backBtn").addEventListener("click", () => {
  if(history.length > 1) history.back();
  else location.href = "../dashboard";
});

const topbar = $("topbar");
function onScroll(){ topbar.classList.toggle("scrolled", window.scrollY > 6); }
onScroll();
window.addEventListener("scroll", onScroll, { passive:true });

/* ================= LOAD DATA ================= */
function showSkeleton(){
  songList.innerHTML = '<div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>';
  pager.hidden = true;
  $("resultCount").textContent = "Memuat…";
}

async function loadSource(url){
  const response = await fetch(url);
  if(!response.ok) throw new Error("Gagal memuat " + url + " (" + response.status + ")");
  const data = await response.json();
  if(!Array.isArray(data)) throw new Error("Format data " + url + " harus berupa array");
  return data;
}

async function loadData(){
  showSkeleton();

  const settled = await Promise.allSettled(sources.map(loadSource));

  const ok = [];
  let failed = 0;
  settled.forEach((r, i) => {
    if(r.status === "fulfilled") ok.push(r.value);
    else{ failed++; console.error("Gagal load JSON:", sources[i], r.reason); }
  });

  if(ok.length === 0){
    $("resultCount").textContent = "Tidak tersedia";
    $("totalVal").classList.remove("sk");
    $("totalVal").textContent = "0";
    songList.innerHTML = "";
    songList.appendChild(stateBox("alert", "Katalog gagal dimuat", "Periksa koneksi internet kamu, lalu coba lagi.", true));
    return;
  }

  songs = ok.flat().map(item => {
    const s = {
      songId: safeText(item["SONG ID"] || item["No"]),
      title: safeText(item["JUDUL LAGU"] || item["Title"]),
      composer: safeText(item["KOMPOSER"] || item["Composer"]),
      publisher: safeText(item["PUBLISHER"]),
      performer: safeText(item["PERFORMER"] || item["Singer"]),
      youtube: normalizeLink(item["LINK"] || item["YOUTUBE LINK REFERENCE"])
    };
    s.ytId = youtubeId(s.youtube);
    s._s = [s.songId, s.title, s.composer, s.publisher, s.performer].join(" ").toLowerCase();
    return s;
  });

  const publishers = populatePublisherFilter();

  $("totalVal").classList.remove("sk");
  animateNumber($("totalVal"), songs.length);
  $("pubCount").textContent = fmt(publishers);

  applyFilters();

  if(failed > 0) toast(failed + " sumber katalog gagal dimuat.");
}

/* ================= PUBLISHER FILTER ================= */
function populatePublisherFilter(){
  const list = [...new Set(songs.map(s => s.publisher).filter(p => p && p !== "-"))]
    .sort((a, b) => a.localeCompare(b));

  publisherFilter.innerHTML = '<option value="">Semua publisher</option>';
  list.forEach(p => {
    const o = document.createElement("option");
    o.value = p;
    o.textContent = p;
    publisherFilter.appendChild(o);
  });
  return list.length;
}

/* ================= FILTER + SORT ================= */
function applyFilters(keepPage){
  const tokens = searchInput.value.toLowerCase().split(/\s+/).filter(Boolean);
  const pub = publisherFilter.value;
  const sort = sortSelect.value;

  filtered = songs.filter(s =>
    (!pub || s.publisher === pub) && tokens.every(t => s._s.includes(t))
  );

  if(sort !== "default"){
    const cmp = (a, b) => a.localeCompare(b, "id", { sensitivity:"base", numeric:true });
    if(sort === "title-asc") filtered.sort((a, b) => cmp(a.title, b.title));
    else if(sort === "title-desc") filtered.sort((a, b) => cmp(b.title, a.title));
    else if(sort === "performer") filtered.sort((a, b) => cmp(a.performer, b.performer));
    else if(sort === "publisher") filtered.sort((a, b) => cmp(a.publisher, b.publisher));
  }

  const active = tokens.length > 0 || pub !== "" || sort !== "default";
  $("resetBtn").hidden = !active;
  $("clearBtn").classList.toggle("show", searchInput.value !== "");

  if(!keepPage) currentPage = 1;
  render();
}

function resetFilters(){
  searchInput.value = "";
  publisherFilter.value = "";
  sortSelect.value = "default";
  applyFilters();
}

/* ================= RENDER ================= */
function stateBox(iconName, title, text, withRetry){
  const d = document.createElement("div");
  d.className = "empty";
  d.style.gridColumn = "1 / -1";
  d.innerHTML = '<div class="ic">' + icon(iconName) + '</div><strong></strong><span></span>';
  d.querySelector("strong").textContent = title;
  d.querySelector("span").textContent = text;
  if(withRetry){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn dark";
    b.innerHTML = icon("refresh") + "Coba lagi";
    b.addEventListener("click", loadData);
    d.appendChild(b);
  }
  return d;
}

function render(){
  songList.innerHTML = "";

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / ITEMS_PER_PAGE));
  if(currentPage > totalPages) currentPage = totalPages;

  $("resultCount").textContent = fmt(total) + " lagu";
  $("hitCount").textContent = fmt(total);

  if(total === 0){
    pager.hidden = true;
    const box = stateBox("search",
      songs.length ? "Lagu tidak ditemukan" : "Katalog masih kosong",
      songs.length ? "Coba kata kunci lain atau ubah filter publisher." : "Belum ada lagu di katalog."
    );
    if(songs.length){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn";
      b.textContent = "Reset filter";
      b.addEventListener("click", resetFilters);
      box.appendChild(b);
    }
    songList.appendChild(box);
    return;
  }

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const frag = document.createDocumentFragment();

  filtered.slice(start, start + ITEMS_PER_PAGE).forEach(song => {
    const card = document.createElement("article");
    card.className = "song";

    const ref = song.youtube !== "-"
      ? '<a class="btn" href="' + escapeHTML(song.youtube) + '" target="_blank" rel="noopener noreferrer">' + icon("ext") + 'Referensi</a>'
      : "";

    card.innerHTML =
      '<div class="s-top">' +
        '<div class="s-ic">' + icon("music") + '</div>' +
        '<div class="s-main">' +
          '<div class="s-title">' + escapeHTML(song.title) + '</div>' +
          '<div class="s-perf">' + escapeHTML(song.performer) + '</div>' +
          '<button type="button" class="s-id" aria-label="Salin Song ID ' + escapeHTML(song.songId) + '">' +
            icon("hash") + '<span class="txt">' + escapeHTML(song.songId) + '</span>' +
            '<span class="cp">' + icon("copy") + '</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="s-meta">' +
        '<div><small>Composer</small><span>' + escapeHTML(song.composer) + '</span></div>' +
        '<div><small>Publisher</small><span>' + escapeHTML(song.publisher) + '</span></div>' +
      '</div>' +
      '<div class="s-acts">' +
        '<button type="button" class="btn dark detail-btn">' + icon("list") + 'Detail lagu</button>' +
        ref +
      '</div>';

    /* preview thumbnail YouTube di bagian atas kartu */
    const thumb = makeThumb(song, false);
    if(thumb) card.insertBefore(thumb, card.firstChild);

    card.querySelector(".detail-btn").addEventListener("click", () => openModal(song));
    card.querySelector(".s-id").addEventListener("click", () => {
      if(song.songId === "-") return toast("Song ID tidak tersedia.");
      copyText(song.songId, "Song ID disalin.");
    });

    frag.appendChild(card);
  });

  songList.appendChild(frag);
  renderPager(totalPages);
}

function pageList(cur, last){
  if(last <= 5) return Array.from({ length:last }, (_, i) => i + 1);
  const set = new Set([1, last, cur - 1, cur, cur + 1]);
  if(cur <= 2) { set.add(2); set.add(3); }
  if(cur >= last - 1) { set.add(last - 1); set.add(last - 2); }
  const nums = [...set].filter(n => n >= 1 && n <= last).sort((a, b) => a - b);
  const out = [];
  nums.forEach((n, i) => {
    if(i > 0 && n - nums[i - 1] > 1) out.push("gap");
    out.push(n);
  });
  return out;
}

function renderPager(totalPages){
  pager.innerHTML = "";
  pager.hidden = totalPages <= 1;
  if(totalPages <= 1) return;

  const mk = (html, label, disabled, onClick, cls) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pg" + (cls ? " " + cls : "");
    b.innerHTML = html;
    b.setAttribute("aria-label", label);
    b.disabled = disabled;
    if(cls === "on") b.setAttribute("aria-current", "page");
    b.addEventListener("click", onClick);
    return b;
  };

  pager.appendChild(mk(icon("chev-l"), "Halaman sebelumnya", currentPage === 1, () => goPage(currentPage - 1)));

  pageList(currentPage, totalPages).forEach(n => {
    if(n === "gap"){
      const g = document.createElement("span");
      g.className = "pg-gap";
      g.textContent = "…";
      pager.appendChild(g);
    }else{
      pager.appendChild(mk(String(n), "Halaman " + n, false, () => goPage(n), n === currentPage ? "on" : ""));
    }
  });

  pager.appendChild(mk(icon("chev-r"), "Halaman berikutnya", currentPage === totalPages, () => goPage(currentPage + 1)));

  const info = document.createElement("div");
  info.className = "page-info";
  info.textContent = "Halaman " + currentPage + " dari " + totalPages;
  pager.appendChild(info);
}

function goPage(n){
  currentPage = n;
  render();
  $("listTop").scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ================= DETAIL ================= */
function openModal(song){
  selectedSong = song;
  lastFocus = document.activeElement;

  $("modalTitle").textContent = song.title;
  $("m_songId").textContent = song.songId;
  $("m_title").textContent = song.title;
  $("m_composer").textContent = song.composer;
  $("m_publisher").textContent = song.publisher;
  $("m_performer").textContent = song.performer;

  const holder = $("m_thumb");
  holder.innerHTML = "";
  const thumb = makeThumb(song, true);
  if(thumb) holder.appendChild(thumb);

  const hasRef = song.youtube !== "-";
  $("m_refRow").hidden = !hasRef;
  if(hasRef) $("m_ref").href = song.youtube;

  $("modal").classList.add("show");
  $("overlay").classList.add("show");
  $("modal").setAttribute("aria-hidden", "false");
  document.body.classList.add("lock");
  $("closeBtn").focus();
}

function closeModal(){
  $("modal").classList.remove("show");
  $("overlay").classList.remove("show");
  $("modal").setAttribute("aria-hidden", "true");
  document.body.classList.remove("lock");
  $("m_thumb").innerHTML = "";
  selectedSong = null;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

function submitRequest(){
  if(!selectedSong){
    toast("Pilih lagu terlebih dahulu.");
    return;
  }

  const songId = selectedSong.songId;
  const title = selectedSong.title;
  const composer = selectedSong.composer;

  if(!songId || songId === "-"){
    toast("Song ID lagu ini tidak tersedia.");
    return;
  }

  window.location.href =
    "../cover-to-master?songId=" +
    encodeURIComponent(songId) +
    "&title=" +
    encodeURIComponent(title) +
    "&composer=" +
    encodeURIComponent(composer === "-" ? "" : composer);
}

/* ================= EVENTS ================= */
searchInput.addEventListener("input", () => {
  $("clearBtn").classList.toggle("show", searchInput.value !== "");
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 150);
});

$("clearBtn").addEventListener("click", () => {
  searchInput.value = "";
  applyFilters();
  searchInput.focus();
});

publisherFilter.addEventListener("change", () => applyFilters());
sortSelect.addEventListener("change", () => applyFilters());
$("resetBtn").addEventListener("click", resetFilters);

$("closeBtn").addEventListener("click", closeModal);
$("closeBtn2").addEventListener("click", closeModal);
$("overlay").addEventListener("click", closeModal);
$("submitBtn").addEventListener("click", submitRequest);
$("copyId").addEventListener("click", () => {
  if(selectedSong && selectedSong.songId !== "-") copyText(selectedSong.songId, "Song ID disalin.");
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("modal").classList.contains("show")){
    closeModal();
    return;
  }
  if(e.key === "/" && !$("modal").classList.contains("show")){
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if(tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA"){
      e.preventDefault();
      searchInput.focus();
    }
  }
});

/* ================= INIT ================= */
loadData();
</script>

</body>
</html>
