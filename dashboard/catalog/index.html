
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Releases | Dynotic Distribution</title>

<link rel="icon" type="image/png" href="https://dynoticcollective.com/assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://dynoticcollective.com/assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://dynoticcollective.com/assets/favicon-iphone.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  min-height:100vh;
  color:#17181c;
  padding-top:64px;
  padding-bottom:105px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

button{font-family:inherit}

/* HEADER */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

.header-logo{
  height:32px;
  width:auto;
  object-fit:contain;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

/* NOTIFICATION */

.notif-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  transition:.15s;
}

.notif-btn:active,
.profile-btn:active{
  transform:scale(.93);
}

.notif-btn i{font-size:16px}

.notif-badge{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:9px;
  font-weight:700;
  display:none;
  align-items:center;
  justify-content:center;
}

/* PROFILE */

.profile-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#17181c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s;
  border:2px solid #f1f2f7;
  overflow:hidden;
}

.profile-btn i{font-size:15px}

.profile-popup{
  position:fixed;
  top:58px;
  right:14px;
  width:260px;
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:16px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  padding:15px;
  z-index:1500;
  display:none;
  animation:popupIn .18s ease;
}

.profile-popup.show{display:block}

.profile-info{
  display:flex;
  align-items:center;
  gap:11px;
  padding-bottom:13px;
}

.profile-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#17181c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.profile-avatar i{font-size:17px}

.profile-details{min-width:0}

.profile-name{
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-email{
  font-size:11px;
  color:#858891;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-divider{
  height:1px;
  background:#eeeeF2;
  margin:2px 0 9px;
}

.profile-option{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 9px;
  border-radius:10px;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:.15s;
}

.profile-option:hover{background:#f5f5f8}

.profile-option i{
  width:18px;
  text-align:center;
  color:#777b84;
  font-size:14px;
}

.profile-option.logout{color:#e04444}
.profile-option.logout i{color:#e04444}

/* MESSAGE POPUP */

.message-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.message-popup.show{display:flex}

.message-card{
  width:100%;
  max-width:340px;
  background:#fff;
  border-radius:17px;
  padding:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
  animation:popupIn .2s ease;
}

.message-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:8px;
}

.message-text{
  font-size:13px;
  color:#555;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.view-btn,.close-btn{
  border:none;
  padding:9px 14px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.view-btn{background:#111;color:#fff}
.close-btn{background:#f1f2f7;color:#333}

/* MAIN */

.container{
  width:calc(100% - 28px);
  max-width:760px;
  margin:0 auto;
}

/* CATALOG MANAGEMENT */

.card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  margin-top:20px;
  animation:pageIn .4s ease both;
}

.catalog-intro{
  cursor:default;
}

.create-text{min-width:0}

.create-title{
  font-size:15px;
  font-weight:700;
}

.create-desc{
  font-size:11px;
  color:#858891;
  margin-top:5px;
  line-height:1.6;
}

/* MANAGEMENT */

.management-card{margin-top:14px}

.section-heading{
  font-size:15px;
  font-weight:700;
  margin-bottom:14px;
}

/* CATEGORY TABS */

.category-scroll{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:12px;
  scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{display:none}

.category-tab{
  flex-shrink:0;
  border:1px solid #e8e8ed;
  background:#fff;
  color:#777b84;
  padding:9px 13px;
  border-radius:11px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:7px;
  transition:.15s;
  white-space:nowrap;
}

.category-tab i{font-size:12px}

.category-tab.active{
  background:#17181c;
  border-color:#17181c;
  color:#fff;
}

.category-tab:active{transform:scale(.96)}

/* SEARCH */

.search-wrap{
  position:relative;
  margin-bottom:10px;
}

.search-wrap i{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:#999ca4;
  pointer-events:none;
}

#searchInput{
  width:100%;
  height:42px;
  padding:0 13px 0 38px;
  border-radius:12px;
  border:1px solid #e8e8ed;
  background:#f8f8fa;
  color:#17181c;
  font-size:13px;
  outline:none;
  transition:.15s;
}

#searchInput:focus{
  border-color:#d6d7dd;
  background:#fff;
}

#searchInput::placeholder{color:#999ca4}

/* FILTER */

.filter-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:15px;
}

.filter-label{
  font-size:11px;
  color:#858891;
  font-weight:600;
  white-space:nowrap;
}

.filter-select{
  flex:1;
  min-width:0;
  height:36px;
  padding:0 11px;
  border:1px solid #e8e8ed;
  border-radius:10px;
  background:#fff;
  color:#333;
  font-size:11px;
  outline:none;
}

/* RELEASE LIST */

.release-box{
  padding:14px;
  border:1px solid #e8e8ed;
  border-radius:15px;
  margin-bottom:10px;
  background:#fff;
  cursor:pointer;
  transition:.15s;
  opacity:0;
  transform:translateY(10px);
  animation:releaseIn .4s ease forwards;
}

.release-box:active{transform:scale(.98)}

.release-item{
  display:flex;
  gap:12px;
  min-width:0;
}

/* COVER */

.release-cover{
  width:46px;
  height:46px;
  border-radius:9px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}

.release-cover img{
  width:46px;
  height:46px;
  object-fit:cover;
  border-radius:8px;
  filter:blur(10px);
  opacity:.6;
  transition:filter .35s ease,opacity .35s ease;
}

.release-cover img.loaded{
  filter:blur(0);
  opacity:1;
}

/* CONTENT */

.release-content{
  flex:1;
  min-width:0;
}

.release-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  min-width:0;
}

.release-title{
  flex:1;
  min-width:0;
  line-height:1.3;
  font-size:13px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

/* STATUS */

.release-status{
  white-space:nowrap;
  flex-shrink:0;
  min-width:68px;
  text-align:center;
  font-size:9px;
  font-weight:600;
  padding:4px 8px;
  border-radius:999px;
  text-transform:uppercase;
  transform-origin:center;
}

.release-status.process{animation:pulse 1.2s infinite}

/* META */

.release-meta{
  font-size:10px;
  color:#858891;
  margin-top:5px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.release-meta b{
  color:#555960;
  font-weight:600;
}

/* EMPTY */

.empty-state{
  text-align:center;
  color:#999ca4;
  font-size:12px;
  padding:25px 8px;
}

.empty-state i{
  display:block;
  font-size:24px;
  margin-bottom:10px;
  opacity:.5;
}

/* PAGINATION */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:15px auto 2px;
}

.pagination button{
  width:36px;
  height:32px;
  border:1px solid #e1e2e7;
  background:#f8f8fa;
  color:#333;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.pagination button:disabled{
  opacity:.4;
  cursor:default;
}

.pagination button:not(:disabled):active{transform:scale(.92)}

.pagination span{
  font-size:11px;
  font-weight:600;
  color:#777b84;
}

/* COMING SOON */

.coming-soon{
  text-align:center;
  padding:35px 12px;
  color:#858891;
}

.coming-soon i{
  font-size:28px;
  margin-bottom:12px;
  color:#b0b2ba;
}

.coming-soon h3{
  font-size:14px;
  color:#34363c;
  margin-bottom:5px;
}

.coming-soon p{
  font-size:11px;
  line-height:1.6;
}

/* BOTTOM NAV */

.bottom-nav{
  height:76px;
  background:#fff;
  border-top:1px solid #e6e6eb;
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
  padding:0 5px;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
  flex:1;
  min-width:0;
  text-align:center;
  font-size:10px;
  font-weight:500;
  color:#999ca4;
  padding:9px 2px;
  cursor:pointer;
  transition:.15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.nav-item i{font-size:18px}

.nav-item:active{transform:scale(.92)}

.nav-item.active{
  color:#17181c;
  font-weight:700;
}

/* CREATE NAV */

.create-nav{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  color:#999ca4;
  font-size:10px;
  font-weight:500;
}

.create-circle{
  width:43px;
  height:43px;
  border-radius:14px;
  background:#17181c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  margin-top:-27px;
  border:4px solid #f1f2f7;
  box-sizing:content-box;
  transition:.15s;
}

.create-nav:active .create-circle{transform:scale(.91)}

.create-label{margin-top:0}

/* ANIMATIONS */

@keyframes pageIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes releaseIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes popupIn{
  from{opacity:0;transform:translateY(-7px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.05);opacity:.8}
}

/* MOBILE */

@media(max-width:600px){
  .container{width:calc(100% - 28px)}
  .card{padding:17px}
  .release-box{padding:13px}
}

/* DESKTOP */

@media(min-width:700px){
  .container{width:100%}
  .bottom-nav{
    padding-left:max(5px,calc((100% - 650px)/2));
    padding-right:max(5px,calc((100% - 650px)/2));
  }
}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <img
    src="https://dynoticcollective.com/assets/dynotic-distribution.png"
    class="header-logo"
    alt="Dynotic Distribution"
  >

  <div class="header-actions">

    <div
      id="notifBtn"
      class="notif-btn"
      onclick="openMessages()"
    >
      <i class="fa-regular fa-bell"></i>
      <span id="notifBadge" class="notif-badge">0</span>
    </div>

    <div
      class="profile-btn"
      onclick="toggleProfile()"
      id="profileBtn"
    >
      <i class="fa-regular fa-user"></i>
    </div>

  </div>

</header>

<!-- PROFILE POPUP -->

<div class="profile-popup" id="profilePopup">

  <div class="profile-info">

    <div class="profile-avatar">
      <i class="fa-regular fa-user"></i>
    </div>

    <div class="profile-details">

      <div class="profile-name" id="profileName">Artist</div>
      <div class="profile-email" id="profileEmail">-</div>

    </div>

  </div>

  <div class="profile-divider"></div>

  <div class="profile-option" onclick="goAccount()">
    <i class="fa-solid fa-gear"></i>
    <span>Account Settings</span>
  </div>

  <div class="profile-option logout" onclick="logout()">
    <i class="fa-solid fa-arrow-right-from-bracket"></i>
    <span>Logout</span>
  </div>

</div>

<!-- NOTIFICATION POPUP -->

<div id="messagePopup" class="message-popup">

  <div class="message-card">

    <div class="message-title" id="msgTitle"></div>

    <div class="message-text" id="msgText"></div>

    <div class="message-actions">

      <button class="view-btn" onclick="viewMessage()">View</button>

      <button class="close-btn" onclick="closeMessage()">✕</button>

    </div>

  </div>

</div>

<!-- MAIN -->

<main class="container">

  <!-- CATALOG MANAGEMENT INTRO -->

  <div class="card catalog-intro">

    <div class="create-text">

      <div class="create-title">
        Catalog Management
      </div>

      <div class="create-desc">
        Manage your music catalog, track release status,
        and organize your distribution records in one place.
      </div>

    </div>

  </div>

  <!-- CATALOG MANAGEMENT -->

  <div class="card management-card">

    <div class="section-heading" id="sectionHeading">
      Releases
    </div>

    <!-- CATEGORY MENU -->

    <div class="category-scroll">

      <button class="category-tab active" data-section="releases" onclick="switchSection('releases')">
        <i class="fa-solid fa-compact-disc"></i>
        Releases
      </button>

      <button class="category-tab" data-section="artists" onclick="switchSection('artists')">
        <i class="fa-solid fa-users"></i>
        Artists
      </button>

      <button class="category-tab" data-section="labels" onclick="switchSection('labels')">
        <i class="fa-solid fa-tag"></i>
        Labels
      </button>

      <button class="category-tab" data-section="participants" onclick="switchSection('participants')">
        <i class="fa-solid fa-user-group"></i>
        Participants
      </button>

      <button class="category-tab" data-section="documents" onclick="switchSection('documents')">
        <i class="fa-solid fa-file-lines"></i>
        Documents
      </button>

      <button class="category-tab" data-section="examples" onclick="switchSection('examples')">
        <i class="fa-solid fa-book-open"></i>
        Examples
      </button>

    </div>

    <!-- RELEASES SECTION -->

    <div id="releasesSection">

      <div class="search-wrap">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="text"
          id="searchInput"
          placeholder="Search title, artist, label..."
          autocomplete="off"
        >

      </div>

      <!-- STATUS FILTER -->

      <div class="filter-row">

        <div class="filter-label">
          <i class="fa-solid fa-filter"></i>
          Status
        </div>

        <select id="statusFilter" class="filter-select">

          <option value="all">All Statuses</option>
          <option value="proposal">Proposal</option>
          <option value="process">Process</option>
          <option value="schedule">Schedule</option>
          <option value="approved">Approved</option>
          <option value="live">Live</option>
          <option value="rejected">Rejected</option>

        </select>

      </div>

      <!-- RELEASE LIST -->

      <div id="releaseList">

        <div class="empty-state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Loading releases...
        </div>

      </div>

    </div>

    <!-- OTHER SECTIONS -->

    <div id="otherSection" hidden>

      <div class="coming-soon">

        <i class="fa-regular fa-folder-open"></i>

        <h3 id="otherTitle">Artists</h3>

        <p id="otherDescription">
          This section is not available yet.
        </p>

      </div>

    </div>

  </div>

  <div style="height:80px"></div>

</main>

<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

  <div class="nav-item" onclick="goHome()">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </div>

  <div class="nav-item active" onclick="goCatalog()">
    <i class="fa-solid fa-compact-disc"></i>
    <span>Catalog</span>
  </div>

  <div class="create-nav" onclick="goCreateRelease()">

    <div class="create-circle">
      <i class="fa-solid fa-plus"></i>
    </div>

    <span class="create-label">Create</span>

  </div>

  <div class="nav-item" onclick="goTransactions()">
    <i class="fa-solid fa-receipt"></i>
    <span>Transactions</span>
  </div>

  <div class="nav-item" onclick="goAnalytics()">
    <i class="fa-solid fa-chart-line"></i>
    <span>Analytics</span>
  </div>

</nav>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

/* ================= ROUTES ================= */

const ROUTES = {

  home: "https://app.dynoticcollective.com/home/",
  catalog: "https://app.dynoticcollective.com/catalog/",
  create: "https://app.dynoticcollective.com/catalog/releases/create/",
  detail: "/release-detail",
  transactions: "https://app.dynoticcollective.com/transactions/",
  analytics: "https://app.dynoticcollective.com/analytics/",
  account: "https://app.dynoticcollective.com/account/",
  login: "https://app.dynoticcollective.com/login/"

};


/* ================= FIREBASE ================= */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});

const db = firebase.database();

let currentUser = null;

let allReleases = [];

let filteredReleases = [];

let currentPage = 1;

const releasesPerPage = 5;


/* ================= SAFE TEXT ================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= AUTH ================= */

firebase.auth().onAuthStateChanged(user => {

  if(!user){

    location.href = ROUTES.login;

    return;

  }

  currentUser = user;

  document.getElementById("profileEmail").textContent =
    user.email || "-";

  loadMessages(user.uid);

  loadArtistProfile(user.uid);

  loadReleases(user.uid);

});


/* ================= PROFILE ================= */

function loadArtistProfile(uid){

  db.ref("users/" + uid)
    .once("value")
    .then(snap => {

      if(!snap.exists()) return;

      const d = snap.val();

      const nama = d.nama || "Artist";

      document.getElementById("profileName").textContent = nama;

    })
    .catch(error => {

/* ================= RELEASE DATA ================= */

function loadReleases(uid){

  const list = document.getElementById("releaseList");

  list.innerHTML = `
    <div class="empty-state">
      <i class="fa-solid fa-spinner fa-spin"></i>
      Loading releases...
    </div>
  `;


  db.ref("releases/" + uid)
    .once("value")

    .then(snap => {

      allReleases = [];


      snap.forEach(i => {

        const r = i.val() || {};

        r._key = i.key;

        allReleases.push(r);

      });


      allReleases.sort((a,b) => {

        return Number(b.time || 0) - Number(a.time || 0);

      });


      document.getElementById("searchInput").oninput =
        applyFilters;

      document.getElementById("statusFilter").onchange =
        applyFilters;


      applyFilters();

    })

    .catch(error => {

      console.error("Gagal memuat releases:",error);

      list.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-circle-exclamation"></i>
          Gagal memuat rilisan.
          <br>
          Silakan coba kembali.
        </div>
      `;

    });

}


/* ================= STATUS ================= */

function getReleaseStatus(r){

  let status = String(r.status || "process")
    .toLowerCase()
    .trim();

  /*
    NORMALISASI STATUS FIREBASE

    proses     -> process
    processing -> process
    process    -> process

    Tampilan tetap PROCESS.
  */

  const statusMap = {

    proses: "process",

    processing: "process",

    process: "process",

    proposal: "proposal",

    schedule: "schedule",

    approved: "approved",

    live: "live",

    rejected: "rejected"

  };


  status = statusMap[status] || status;


  const releaseDate = r.releaseDate || r.date;

  const dateObj = releaseDate
    ? new Date(
        releaseDate +
        (releaseDate.length === 10 ? "T00:00:00" : "")
      )
    : null;


  if(status === "approved"){

    if(
      dateObj &&
      !isNaN(dateObj.getTime()) &&
      new Date() >= dateObj
    ){

      return "live";

    }

    return "approved";

  }


  if(status === "live") return "live";

  if(status === "proposal") return "proposal";

  if(status === "process") return "process";

  if(status === "schedule") return "schedule";

  if(status === "rejected") return "rejected";


  return status;

}


function getStatusStyle(status){

  const styles = {

    proposal:{
      label:"PROPOSAL",
      color:"#f59e0b"
    },

    process:{
      label:"PROCESS",
      color:"#3b82f6"
    },

    schedule:{
      label:"SCHEDULE",
      color:"#8b5cf6"
    },

    approved:{
      label:"APPROVED",
      color:"#10b981"
    },

    live:{
      label:"LIVE",
      color:"#22c55e"
    },

    rejected:{
      label:"REJECTED",
      color:"#ef4444"
    }

  };


  return styles[status] || {

    label:status.toUpperCase(),

    color:"#858891"

  };

}


/* ================= FILTER ================= */

function applyFilters(){

  const query = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


  const selectedStatus = document
    .getElementById("statusFilter")
    .value;


  filteredReleases = allReleases.filter(r => {

    const title = String(r.title || "").toLowerCase();

    const artist = String(r.artist || "").toLowerCase();

    const label = String(r.label || "").toLowerCase();

    // Status sudah dinormalisasi oleh getReleaseStatus()
    const status = getReleaseStatus(r);


    const matchesSearch =
      title.includes(query) ||
      artist.includes(query) ||
      label.includes(query);


    const matchesStatus =
      selectedStatus === "all" ||
      status === selectedStatus;


    return matchesSearch && matchesStatus;

  });


  currentPage = 1;

  renderReleases();

}


/* ================= DATE ================= */

function formatReleaseDate(r){

  const date = r.releaseDate || r.date;

  if(!date) return "-";

  const parsed = new Date(
    date + (date.length === 10 ? "T00:00:00" : "")
  );

  if(isNaN(parsed.getTime())) return "-";

  return parsed.toLocaleDateString("en-US",{

    year:"numeric",

    month:"long",

    day:"numeric"

  });

}


/* ================= RENDER ================= */

function renderReleases(){

  const list = document.getElementById("releaseList");

  list.innerHTML = "";


  if(filteredReleases.length === 0){

    const hasFilter =
      document.getElementById("searchInput").value ||
      document.getElementById("statusFilter").value !== "all";


    list.innerHTML = `

      <div class="empty-state">

        <i class="fa-regular fa-folder-open"></i>

        ${
          hasFilter
            ? "Tidak ditemukan hasil"
            : "Belum ada rilisan"
        }

      </div>

    `;

    return;

  }


  const totalPages = Math.ceil(
    filteredReleases.length / releasesPerPage
  );


  if(currentPage > totalPages){
    currentPage = totalPages;
  }


  const start = (currentPage - 1) * releasesPerPage;

  const pageItems = filteredReleases.slice(
    start,
    start + releasesPerPage
  );


  pageItems.forEach((r,index) => {

    const status = getReleaseStatus(r);

    const statusInfo = getStatusStyle(status);

    const title = escapeHTML(r.title || "-");

    const artist = escapeHTML(r.artist || "-");

    const label = escapeHTML(r.label || "Dynotic");

    const featuring = r.featuring
      ? " • feat. " + escapeHTML(r.featuring)
      : "";

    const ean = escapeHTML(r.ean || "-");

    const date = escapeHTML(formatReleaseDate(r));

    const genre = escapeHTML(r.genre || "-");

    const cover = escapeHTML(
      r.cover || "https://dynoticcollective.com/assets/cover-default.png"
    );


    const box = document.createElement("div");

    box.className = "release-box";

    box.style.animationDelay = (index * 0.06) + "s";

    box.onclick = () => goReleaseDetail(r._key);


    box.innerHTML = `

      <div class="release-item">

        <div class="release-cover">

          <img
            src="${cover}"
            alt="Release Cover"
            onload="this.classList.add('loaded')"
            onerror="
              this.onerror=null;
              this.src='https://dynoticcollective.com/assets/cover-default.png';
              this.classList.add('loaded');
            "
          >

        </div>

        <div class="release-content">

          <div class="release-row">

            <div class="release-title">
              ${title}
            </div>

            <div
              class="release-status ${status === "process" ? "process" : ""}"
              style="
                border:1px solid ${statusInfo.color};
                color:${statusInfo.color};
              "
            >
              ${escapeHTML(statusInfo.label)}
            </div>

          </div>

          <div class="release-meta">

            <b>${artist}</b>${featuring}

            <br>

            <span style="opacity:.7">UPC:</span>
            ${ean}

            <br>

            <span style="opacity:.7">Release Date:</span>
            ${date}

            <br>

            <span style="opacity:.7">Label:</span>
            ${label}

            <br>

            <span style="opacity:.7">Genre:</span>
            ${genre}

          </div>

        </div>

      </div>

    `;


    list.appendChild(box);

  });


  /* PAGINATION */

  const pagination = document.createElement("div");

  pagination.className = "pagination";


  const prev = document.createElement("button");

  prev.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';

  prev.disabled = currentPage === 1;

  prev.onclick = prevPage;


  const pageText = document.createElement("span");

  pageText.textContent =
    `Page ${currentPage}/${totalPages}`;


  const next = document.createElement("button");

  next.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';

  next.disabled = currentPage === totalPages;

  next.onclick = nextPage;


  pagination.append(prev,pageText,next);

  list.appendChild(pagination);

}


/* ================= PAGINATION ================= */

function nextPage(){

  const totalPages = Math.ceil(
    filteredReleases.length / releasesPerPage
  );


  if(currentPage < totalPages){

    currentPage++;

    renderReleases();

  }

}


function prevPage(){

  if(currentPage > 1){

    currentPage--;

    renderReleases();

  }

}

/* ================= MESSAGES ================= */

let messagesQueue = [];

let currentMsgIndex = 0;


function loadMessages(uid){

  db.ref("messages_inbox/" + uid)
    .on("value",snap => {

      messagesQueue = [];

      snap.forEach(i => {

        const m = i.val() || {};

        if(!m.read){

          messagesQueue.push({

            ...m,

            key:i.key

          });

        }

      });


      const badge = document.getElementById("notifBadge");


      if(messagesQueue.length > 0){

        badge.style.display = "flex";

        badge.textContent =
          messagesQueue.length > 99
            ? "99+"
            : messagesQueue.length;

      }else{

        badge.style.display = "none";

      }

    },error => {

      console.error("Gagal memuat notifikasi:",error);

    });

}


/* ================= OPEN MESSAGES ================= */

function openMessages(){

  if(messagesQueue.length === 0) return;

  currentMsgIndex = 0;

  showCurrentMessage();

}


function showCurrentMessage(){

  if(currentMsgIndex >= messagesQueue.length){

    document
      .getElementById("messagePopup")
      .classList.remove("show");

    return;

  }


  const m = messagesQueue[currentMsgIndex];


  document.getElementById("msgTitle").textContent =
    m.subject || "-";

  document.getElementById("msgText").textContent =
    m.body || "-";


  document
    .getElementById("messagePopup")
    .classList.add("show");

}


/* ================= CLOSE MESSAGE ================= */

function closeMessage(){

  const m = messagesQueue[currentMsgIndex];

  if(currentUser && m){

    db.ref(
      "messages_inbox/" +
      currentUser.uid +
      "/" +
      m.key +
      "/read"
    ).set(true);

  }


  currentMsgIndex++;

  showCurrentMessage();

}


/* ================= VIEW MESSAGE ================= */

function viewMessage(){

  closeMessage();

}


/* ================= OUTSIDE POPUP ================= */

document.getElementById("messagePopup")
  .addEventListener("click",function(e){

    if(e.target === this){

      this.classList.remove("show");

    }

  });

</script>
