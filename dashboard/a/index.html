<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artist | Dynotic Distribution</title>
<meta name="theme-color" content="#0d0d12">
<meta name="description" content="Semua link artis dalam satu halaman.">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-iphone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--dark:#0d0d12;--accent:#7772a8;--accent-2:#a9a3f2;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Outfit",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--dark);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
  padding:max(40px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom))}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:-1}
body::before{width:420px;height:420px;background:rgba(119,114,168,.5);top:-180px;left:50%;transform:translateX(-50%)}
body::after{width:320px;height:320px;background:rgba(79,70,160,.35);bottom:-160px;right:-80px}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}

.page{max-width:460px;margin:0 auto;text-align:center}
.ph{width:112px;height:112px;margin:0 auto;border-radius:50%;background:#2a2840 center/cover no-repeat;border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;animation:up .6s var(--ease) both}
h1{margin-top:16px;font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.04em;line-height:1.15;overflow-wrap:anywhere;animation:up .6s var(--ease) .05s both}
.bio{margin-top:10px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.65);white-space:pre-wrap;overflow-wrap:anywhere;animation:up .6s var(--ease) .1s both}
.links{margin-top:26px;display:grid;gap:10px}
.lk{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left;transition:transform .25s var(--ease),background .25s;animation:up .6s var(--ease) both}
.lk:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.lk:active{transform:scale(.98)}
.lk .b{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0}
.lk strong{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk svg{width:17px;height:17px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.foot{margin-top:38px;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.04em}
.foot a{font-weight:700;color:rgba(255,255,255,.65)}
.state{padding-top:20vh;font-size:14px;line-height:1.7;color:rgba(255,255,255,.6)}
.state h1{margin:0 0 8px;font-size:24px;animation:none}
.spin{width:30px;height:30px;margin:0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent-2);animation:r .8s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page" id="page"><div class="state"><div class="spin" role="status" aria-label="Memuat"></div></div></main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();
const page = document.getElementById("page");

const COLORS = {
  "Instagram":"linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af)","TikTok":"linear-gradient(135deg,#25f4ee,#111 55%,#fe2c55)",
  "YouTube":"#ff0000","Spotify":"#1db954","Apple Music":"linear-gradient(135deg,#fa233b,#fb5c74)","YouTube Music":"#ff0033",
  "Facebook":"#1877f2","X (Twitter)":"#111","WhatsApp":"#25d366","Website":"#7772a8","Lainnya":"#7772a8"
};

/* slug dari /a/{slug} atau ?s={slug} */
function getSlug(){
  const q = new URLSearchParams(location.search).get("s");
  let s = q || (location.pathname.match(/\/a\/([^\/?#]+)/) || [])[1] || "";
  try{ s = decodeURIComponent(s); }catch(e){}
  return s.toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,30);
}

function safeUrl(u){
  try{ const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : ""; }catch(e){ return ""; }
}

function showState(title, text){
  page.innerHTML = '<div class="state"><h1></h1><p></p></div>';
  page.querySelector("h1").textContent = title;
  page.querySelector("p").textContent = text;
}

function render(p){
  const name = p.name || "Artist";
  document.title = name + " | Dynotic Distribution";
  const meta = document.querySelector('meta[name="description"]');
  meta.content = (p.bio || "Semua link " + name + " dalam satu halaman.").slice(0,160);

  page.innerHTML = '<div class="ph"></div><h1></h1><p class="bio"></p><div class="links"></div><p class="foot">Dibuat dengan <a href="https://app.dynoticcollective.com" rel="noopener">Dynotic Distribution</a></p>';
  const ph = page.querySelector(".ph");
  if(p.photo && /^data:image\/|^https?:\/\//.test(p.photo)){ ph.style.backgroundImage = 'url("' + p.photo + '")'; }
  else{ ph.textContent = name.trim().charAt(0).toUpperCase() || "A"; }
  page.querySelector("h1").textContent = name;
  const bio = page.querySelector(".bio");
  if(p.bio) bio.textContent = p.bio; else bio.remove();

  const box = page.querySelector(".links");
  (p.links || []).forEach((l, i) => {
    const href = safeUrl(l.url);
    if(!href) return;
    const a = document.createElement("a");
    a.className = "lk"; a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.style.animationDelay = (.15 + i * .05) + "s";
    a.innerHTML = '<span class="b"></span><strong></strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
    const b = a.querySelector(".b");
    b.style.background = COLORS[l.platform] || COLORS["Lainnya"];
    b.textContent = String(l.platform || "L").charAt(0).toUpperCase();
    a.querySelector("strong").textContent = l.platform || "Link";
    box.appendChild(a);
  });
}

async function load(){
  const slug = getSlug();
  if(!slug) return showState("Halaman tidak ditemukan", "Link yang kamu buka tidak lengkap.");
  try{
    const s = await db.ref("artist_slugs/" + slug).once("value");
    if(!s.exists()) return showState("Halaman tidak ditemukan", "Artist page ini belum ada atau sudah dihapus.");
    const { uid, pid } = s.val();
    const d = await db.ref("artist_pages/" + uid + "/" + pid).once("value");
    if(!d.exists()) return showState("Halaman tidak ditemukan", "Artist page ini belum ada atau sudah dihapus.");
    render(d.val());
  }catch(e){
    console.error(e);
    showState("Gagal memuat", "Coba muat ulang halaman ini.");
  }
}
load();
</script>
</body>
</html>
