<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  min-height:100vh;
  color:#17181c;
  padding-top:64px;
  padding-bottom:105px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

button{
  font-family:inherit;
}

/* ================= HEADER ================= */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

.header-logo{
  height:32px;
  width:auto;
  object-fit:contain;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

/* ================= NOTIFICATION ================= */

.notif-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  transition:.15s;
}

.notif-btn:active,
.profile-btn:active{
  transform:scale(.93);
}

.notif-btn i{
  font-size:16px;
}

.notif-badge{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:9px;
  font-weight:700;
  display:none;
  align-items:center;
  justify-content:center;
}

/* ================= PROFILE ================= */

.profile-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#17181c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s;
  border:2px solid #f1f2f7;
  overflow:hidden;
}

.profile-btn i{
  font-size:15px;
}

.profile-popup{
  position:fixed;
  top:58px;
  right:14px;
  width:260px;
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:16px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  padding:15px;
  z-index:1500;
  display:none;
  animation:popupIn .18s ease;
}

.profile-popup.show{
  display:block;
}

.profile-info{
  display:flex;
  align-items:center;
  gap:11px;
  padding-bottom:13px;
}

.profile-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#17181c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.profile-avatar i{
  font-size:17px;
}

.profile-details{
  min-width:0;
}

.profile-name{
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-email{
  font-size:11px;
  color:#858891;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-divider{
  height:1px;
  background:#eeeeF2;
  margin:2px 0 9px;
}

.profile-option{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 9px;
  border-radius:10px;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:.15s;
}

.profile-option:hover{
  background:#f5f5f8;
}

.profile-option i{
  width:18px;
  text-align:center;
  color:#777b84;
  font-size:14px;
}

.profile-option.logout{
  color:#e04444;
}

.profile-option.logout i{
  color:#e04444;
}

/* ================= MAIN ================= */

.container{
  width:calc(100% - 28px);
  max-width:760px;
  margin:0 auto;
}

/* ================= WALLET ================= */

.card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  margin-top:20px;
  animation:pageIn .4s ease both;
}

.wallet-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  cursor:pointer;
  transition:.15s;
}

.wallet-card:active{
  transform:scale(.99);
}

.wallet-content{
  min-width:0;
}

.artist-name{
  font-size:12px;
  font-weight:500;
  color:#777b84;
  margin-bottom:5px;
}

.balance-title{
  font-size:13px;
  font-weight:600;
  color:#25262b;
}

.card-value{
  font-size:clamp(22px,6vw,32px);
  font-weight:700;
  color:#111;
  margin-top:4px;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
}

.wallet-desc{
  font-size:10px;
  color:#888b93;
  margin-top:6px;
  line-height:1.4;
}

.detail-btn{
  flex-shrink:0;
  padding:10px 13px;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.detail-btn i{
  font-size:11px;
}

/* ================= SECTION ================= */

.section-title{
  font-size:13px;
  font-weight:600;
  color:#777b84;
  margin:24px 3px 10px;
}

/* ================= TOOLS ================= */

.tools-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.tool-item{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:16px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  transition:.18s ease;
  animation:pageIn .4s ease both;
}

.tool-item:active{
  transform:scale(.97);
}

.tool-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  flex-shrink:0;
}

.tool-text{
  min-width:0;
}

.tool-title{
  font-size:13px;
  font-weight:600;
  line-height:1.3;
}

.tool-desc{
  font-size:10px;
  color:#858891;
  margin-top:3px;
  line-height:1.4;
}

/* ================= NOTIFICATION POPUP ================= */

.message-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.message-popup.show{
  display:flex;
}

.message-card{
  width:100%;
  max-width:340px;
  background:#fff;
  border-radius:17px;
  padding:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
  animation:popupIn .2s ease;
}

.message-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:8px;
}

.message-text{
  font-size:13px;
  color:#555;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.view-btn,
.close-btn{
  border:none;
  padding:9px 14px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.view-btn{
  background:#111;
  color:#fff;
}

.close-btn{
  background:#f1f2f7;
  color:#333;
}

/* ================= BOTTOM NAVIGATION ================= */

.bottom-nav{
  height:76px;
  background:#fff;
  border-top:1px solid #e6e6eb;
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
  padding:0 5px;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
  flex:1;
  min-width:0;
  text-align:center;
  font-size:10px;
  font-weight:500;
  color:#999ca4;
  padding:9px 2px;
  cursor:pointer;
  transition:.15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.nav-item i{
  font-size:18px;
}

.nav-item:active{
  transform:scale(.92);
}

.nav-item.active{
  color:#17181c;
  font-weight:700;
}

/* ================= CREATE BUTTON ================= */

.create-nav{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  color:#999ca4;
  font-size:10px;
  font-weight:500;
}

.create-circle{
  width:43px;
  height:43px;
  border-radius:14px;
  background:#17181c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  margin-top:-27px;
  border:4px solid #f1f2f7;
  box-sizing:content-box;
  transition:.15s;
}

.create-nav:active .create-circle{
  transform:scale(.91);
}

.create-label{
  margin-top:0;
}

/* ================= ANIMATIONS ================= */

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:translateY(-7px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .container{
    width:calc(100% - 28px);
  }

  .wallet-card{
    padding:17px;
  }

  .card-value{
    font-size:23px;
  }

  .tools-grid{
    grid-template-columns:1fr;
  }

}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  .container{
    width:100%;
  }

  .bottom-nav{
    padding-left:max(5px,calc((100% - 650px)/2));
    padding-right:max(5px,calc((100% - 650px)/2));
  }

}

</style>

</head>

<body>

    class="create-nav"

  >

    </span>

  </div>

    class="nav-item"

  <div
    class="nav-item"
    onclick="goAnalytics()"

<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>

/* ================= ROUTES ================= */

const ROUTES = {

  home: "../dashboard",

  catalog: "../catalog",

  create: "../releases/create",

  transactions: "../transactions",

  analytics: "../analytics",

  account: "../account",

  income: "../income",

  oac: "../oac",

  artwork: "../artwork-generate",

  login: "../login"

};


/* ================= FIREBASE CONFIG ================= */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const db = firebase.database();

let targetSaldo = 0;

let currentUser = null;


/* ================= AUTH ================= */

firebase.auth().onAuthStateChanged(user => {

  if(!user){

    location.href = ROUTES.login;

    return;

  }

  currentUser = user;

  // PROFILE EMAIL

  document.getElementById(
    "profileEmail"
  ).textContent = user.email || "-";


  // LOAD NOTIFICATIONS

  loadMessages(user.uid);


  // LOAD ARTIST DATA

  db.ref("users/" + user.uid)
    .once("value")
    .then(snap => {

      if(!snap.exists()) return;

      const d = snap.val();

      targetSaldo = Number(d.saldo || 0);

      const nama = d.nama || "Artist";


      document.getElementById(
        "namaArtis"
      ).textContent = "Hi, " + nama;


      document.getElementById(
        "profileName"
      ).textContent = nama;


      animateSaldo();

    })
    .catch(error => {

      console.error(
        "Gagal memuat data artist:",
        error
      );

    });

});


/* ================= SALDO ANIMATION ================= */

function animateSaldo(){

  let angka = 0;

  const step =
    Math.ceil(targetSaldo / 15) || 1;

  const saldoElement =
    document.getElementById("saldo");

  const i = setInterval(() => {

    if(angka < targetSaldo){

      angka += step;

      if(angka > targetSaldo){

        angka = targetSaldo;

      }

      saldoElement.innerHTML = `

        <span style="font-size:.6em;opacity:.7">
          Rp
        </span>

        <span>
          ${angka.toLocaleString("id-ID")}
        </span>

      `;

    }else{

      clearInterval(i);

    }

  },15);

}


/* ================= PROFILE POPUP ================= */

function toggleProfile(){

  const popup =
    document.getElementById("profilePopup");

  popup.classList.toggle("show");

}


function closeProfile(){

  document
    .getElementById("profilePopup")
    .classList.remove("show");

}


// CLOSE PROFILE WHEN CLICKING OUTSIDE

document.addEventListener("click", function(e){

  const popup =
    document.getElementById("profilePopup");

  const button =
    document.getElementById("profileBtn");

  if(
    !popup.contains(e.target) &&
    !button.contains(e.target)
  ){

    closeProfile();

  }

});


/* ================= ACCOUNT ================= */

function goAccount(){

  closeProfile();

  location.href = ROUTES.account;

}


/* ================= LOGOUT ================= */

function logout(){

  firebase.auth()
    .signOut()
    .then(() => {

      location.href = ROUTES.login;

    })
    .catch(error => {

      console.error(
        "Logout gagal:",
        error
      );

    });

}


/* ================= NAVIGATION ================= */

function homeClick(){

  closeProfile();

  // Already on Home.

}


function goCatalog(){

  location.href = ROUTES.catalog;

}


function goCreateRelease(){

  location.href = ROUTES.create;

}


function goTransactions(){

  location.href = ROUTES.transactions;

}


function goAnalytics(){

  location.href = ROUTES.analytics;

}


function goRekapan(){

  location.href = ROUTES.income;

}


function goOAC(){

  location.href = ROUTES.oac;

}


function goArtwork(){

  location.href = ROUTES.artwork;

}


/* ================= MESSAGES ================= */

let messagesQueue = [];

let currentMsgIndex = 0;


function loadMessages(uid){

  db.ref("messages_inbox/" + uid)
    .on("value", snap => {

      messagesQueue = [];

      snap.forEach(i => {

        const m = i.val();

        if(!m.read){

          messagesQueue.push({

            ...m,

            key:i.key

          });

        }

      });


      const badge =
        document.getElementById("notifBadge");


      if(messagesQueue.length > 0){

        badge.style.display = "flex";

        badge.textContent =
          messagesQueue.length;

      }else{

        badge.style.display = "none";

      }

    }, error => {

      console.error(
        "Gagal memuat notifikasi:",
        error
      );

    });

}


/* ================= OPEN MESSAGES ================= */

function openMessages(){

  if(messagesQueue.length === 0){

    return;

  }

  currentMsgIndex = 0;

  showCurrentMessage();

}


/* ================= SHOW MESSAGE ================= */

function showCurrentMessage(){

  if(
    currentMsgIndex >= messagesQueue.length
  ){

    document
      .getElementById("messagePopup")
      .classList.remove("show");

    return;

  }


  const m =
    messagesQueue[currentMsgIndex];


  document.getElementById(
    "msgTitle"
  ).textContent =
    m.subject || "-";


  document.getElementById(
    "msgText"
  ).textContent =
    m.body || "-";


  document
    .getElementById("messagePopup")
    .classList.add("show");

}


/* ================= CLOSE MESSAGE ================= */

function closeMessage(){

  const user =
    firebase.auth().currentUser;

  const m =
    messagesQueue[currentMsgIndex];


  if(user && m){

    db.ref(
      "messages_inbox/" +
      user.uid +
      "/" +
      m.key +
      "/read"
    ).set(true);

  }


  currentMsgIndex++;

  showCurrentMessage();

}


/* ================= VIEW MESSAGE ================= */

function viewMessage(){

  closeMessage();

}


/* ================= CLOSE POPUP OUTSIDE ================= */

document.getElementById(
  "messagePopup"
).addEventListener("click", function(e){

  if(e.target === this){

    this.classList.remove("show");

  }

});


/* ================= PAGE ANIMATION ================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    document
      .querySelectorAll(".card,.tool-item")
      .forEach((c,idx) => {

        setTimeout(
          () => {

            c.style.opacity = "1";

          },
          idx * 100
        );

      });

  }
);

</script>

</body>
</html>
