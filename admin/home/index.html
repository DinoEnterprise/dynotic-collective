<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Dynotic Admin</title>
<link rel="icon" type="image/png" href="https://dynoticcollective.com/assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://dynoticcollective.com/assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://dynoticcollective.com/assets/favicon-iphone.png">
<meta name="theme-color" content="#f3f3f8">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f3f8;--paper:#fff;--ink:#14141a;--muted:#6f7280;--line:#e6e6ee;--dark:#0d0d12;--accent:#7772a8;--accent-2:#a9a3f2;--side:260px;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Outfit",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;padding-bottom:110px}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* sidebar */
.sidebar{display:none;position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--dark);color:#fff;padding:26px 18px 20px;flex-direction:column;z-index:60;overflow-y:auto}
.sidebar .logo img{height:32px;max-width:180px;object-fit:contain;filter:brightness(0) invert(1);display:block;margin:0 8px 30px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;color:rgba(255,255,255,.62);transition:background .2s,color .2s}
.side-nav a .i{width:19px;height:19px}
.side-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side-nav a.active{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
/* topbar */
.topbar{position:sticky;top:0;z-index:50;height:68px;padding:0 16px;display:flex;align-items:center;gap:12px;background:rgba(243,243,248,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.logo-m img{height:30px;max-width:170px;object-fit:contain;display:block}
.page-title{display:none;font-size:20px;font-weight:800;letter-spacing:-.03em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar-btn{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);transition:transform .2s var(--ease)}
.avatar-btn:active{transform:scale(.93)}
/* layout */
.wrap{width:100%;max-width:960px;margin:0 auto;padding:6px 16px 0}
.head{padding:10px 2px 18px}
.head small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.head h1{margin-top:2px;font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--dark);color:#fff;border-radius:26px;padding:clamp(20px,3vw,28px);animation:up .6s var(--ease) both}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-110px;background:radial-gradient(circle,rgba(119,114,168,.55),transparent 70%);z-index:-1}
.hero small{display:block;font-size:13px;color:rgba(255,255,255,.6);font-weight:500}
.hero strong{display:block;margin-top:10px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
.hero p{margin-top:10px;max-width:460px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.55)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat{padding:16px 16px 14px;background:var(--paper);border:1px solid var(--line);border-radius:20px;animation:up .6s var(--ease) .08s both}
.stat small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.stat strong{display:block;margin-top:6px;font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.04em;line-height:1}
/* bottom nav */
.bottom{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 28px);max-width:540px;height:70px;padding:0 8px;background:rgba(13,13,18,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:26px;box-shadow:0 18px 40px rgba(13,13,18,.3);display:flex;align-items:center;justify-content:space-around;z-index:70}
.b-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;font-size:10px;font-weight:500;color:rgba(255,255,255,.5);transition:color .2s,transform .15s}
.b-item .i{width:20px;height:20px}
.b-item:active{transform:scale(.92)}
.b-item.active{color:#fff;font-weight:700}
.b-item.active .i{color:var(--accent-2)}
/* popup */
.pop{position:fixed;top:70px;right:14px;width:230px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(20,20,40,.16);padding:10px;z-index:200;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:all .22s var(--ease)}
.pop.show{opacity:1;visibility:visible;transform:none}
.pop-info{display:flex;align-items:center;gap:12px;padding:10px 10px 14px}
.pop-info .avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.pop-info strong{display:block;font-size:14px}
.pop-info span{display:block;margin-top:2px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.pop hr{border:0;height:1px;background:var(--line);margin:2px 4px 6px}
.pop button.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:12px;font-size:13px;font-weight:500;text-align:left}
.pop button.opt:hover{background:var(--bg)}
.pop .i{width:17px;height:17px;color:var(--muted)}
.pop .logout,.pop .logout .i{color:#d83a3a}
/* loading */
.loading{position:fixed;inset:0;background:rgba(243,243,248,.8);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:500}
.loading.show{display:flex}
.loader-box{background:#fff;border:1px solid var(--line);padding:16px 22px;border-radius:16px;font-size:14px;font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(min-width:1000px){
body{padding-bottom:40px;padding-left:var(--side)}
.sidebar{display:flex}.bottom{display:none}
.topbar{height:78px;padding:0 36px}.logo-m{display:none}.page-title{display:block}
.wrap{padding:6px 36px 0}.pop{top:76px;right:34px}
}
@media(max-width:700px){
.wrap{padding:0 14px}.hero{border-radius:22px}
.stat{padding:14px 12px 12px;border-radius:18px}
.pop{right:12px;top:66px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10.5 9-7.5 9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
<symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
</svg>

<aside class="sidebar">
  <a href="../home" class="logo"><img src="https://dynoticcollective.com/assets/dynotic-distribution.png" alt="Dynotic Distribution"></a>
  <nav class="side-nav" aria-label="Main navigation">
    <a href="../home" class="active"><svg class="i"><use href="#i-home"/></svg>Home</a>
    <a href="../users"><svg class="i"><use href="#i-users"/></svg>Artists &amp; Accounts</a>
    <a href="../releases"><svg class="i"><use href="#i-disc"/></svg>Release Submissions</a>
    <a href="../message"><svg class="i"><use href="#i-chat"/></svg>Support Inbox</a>
    <a href="../income"><svg class="i"><use href="#i-chart"/></svg>Royalty Management</a>
  </nav>
</aside>

<header class="topbar" id="topbar">
  <a href="../home" class="logo-m"><img src="https://dynoticcollective.com/assets/dynotic-distribution.png" alt="Dynotic Distribution"></a>
  <h2 class="page-title">Home</h2>
  <div class="top-actions">
    <button class="avatar-btn" id="profileBtn" type="button" aria-label="Menu admin" aria-expanded="false">A</button>
  </div>
</header>

<div class="pop" id="profileMenu" role="menu">
  <div class="pop-info"><div class="avatar">A</div><div><strong>Admin</strong><span id="adminEmail">-</span></div></div>
  <hr>
  <button class="opt logout" type="button" onclick="logout()" role="menuitem"><svg class="i"><use href="#i-logout"/></svg>Logout</button>
</div>

<main class="wrap">
  <div class="head"><small>Dynotic Admin Panel</small><h1>Home</h1></div>

  <section class="hero">
    <small>Selamat datang kembali</small>
    <strong>Hi, Admin</strong>
    <p>Kelola artis, rilisan, dan royalti dari satu tempat.</p>
  </section>

  <section class="stats" aria-label="Ringkasan">
    <div class="stat"><small>Artists</small><strong id="artistCount">–</strong></div>
    <div class="stat"><small>Releases</small><strong id="releaseCount">–</strong></div>
  </section>
</main>

<nav class="bottom" aria-label="Main navigation">
  <a href="../home" class="b-item active"><svg class="i"><use href="#i-home"/></svg>Home</a>
  <a href="../users" class="b-item"><svg class="i"><use href="#i-users"/></svg>Artists</a>
  <a href="../releases" class="b-item"><svg class="i"><use href="#i-disc"/></svg>Releases</a>
  <a href="../message" class="b-item"><svg class="i"><use href="#i-chat"/></svg>Inbox</a>
  <a href="../income" class="b-item"><svg class="i"><use href="#i-chart"/></svg>Royalty</a>
</nav>

<div class="loading" id="loading"><div class="loader-box">Loading...</div></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
  authDomain: "dynopay-2513c.firebaseapp.com",
  databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const auth = firebase.auth(), db = firebase.database();
const $ = id => document.getElementById(id);

/* ---------- proteksi admin ---------- */
auth.onAuthStateChanged(user => {
  if(!user){ location.href = "../login"; return; }
  $("adminEmail").textContent = user.email || "-";
  db.ref("admins/" + user.uid).once("value").then(snap => {
    if(!snap.exists()){ alert("Anda bukan admin."); auth.signOut(); return; }
    loadOverview();
  }).catch(err => console.error("Admin verification error:", err));
});

/* ---------- overview ---------- */
function count(path, id){
  db.ref(path).once("value")
    .then(s => { $(id).textContent = s.numChildren(); })
    .catch(() => { $(id).textContent = "0"; });
}
function loadOverview(){
  count("users", "artistCount");
  count("releases", "releaseCount");
}

/* ---------- profil & logout ---------- */
const menu = $("profileMenu"), btn = $("profileBtn");
function setMenu(o){ menu.classList.toggle("show", o); btn.setAttribute("aria-expanded", String(o)); }
btn.addEventListener("click", e => { e.stopPropagation(); setMenu(!menu.classList.contains("show")); });
document.addEventListener("click", e => { if(!menu.contains(e.target) && !btn.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", e => { if(e.key === "Escape") setMenu(false); });
function logout(){
  if(confirm("Logout dari admin panel?")) auth.signOut().then(() => { location.href = "../login"; });
}

/* ---------- topbar ---------- */
const topbar = $("topbar");
const onScroll = () => topbar.classList.toggle("scrolled", scrollY > 6);
onScroll(); addEventListener("scroll", onScroll, { passive:true });
</script>
</body>
</html>
